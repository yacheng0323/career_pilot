name: career_pilot
description: "AI Job Finder — browse, search, and track job opportunities."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Immutable models
  freezed_annotation: ^2.4.4

  # Navigation
  go_router: ^14.6.3

  shared_preferences: ^2.3.0

  # HTTP client for AI API calls
  http: ^1.2.2
  shimmer: ^3.0.0

  dio: ^5.8.0
  appflowy_board: ^0.1.2
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_card_swiper: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.8
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/mock/
